<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGOGO - Вхід</title>
    <link rel="stylesheet" href="mehohoe style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo"><a href="index.html" style="text-decoration: none; color: white;">MEGOGO</a></div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Телеканали</a></li>
                    <li><a href="index.html">Фільми</a></li>
                    <li class="dropdown">
                        <a href="index.html">Мультфільми</a>
                        <ul class="dropdown-content">
                            <li><a href="#">Мультфільми Disney</a></li>
                            <li><a href="#">Мультсеріали Nickelodeon</a></li>
                        </ul>
                    </li>
                    <li><a href="index.html">Серіали</a></li>
                </ul>
            </nav>
            <div class="header-controls">
                <a href="#" class="btn-tariffs">Тарифи</a>
                <span class="lang">UA</span>
            </div>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">
            <h2>Вхід або Реєстрація</h2>
            <form>
                <input type="text" placeholder="E-mail або телефон" required>
                <input type="password" placeholder="Пароль" required>
                <button type="submit" class="btn-connect">Увійти</button>
                <button type="button" class="btn-register">Зареєструватись</button>
            </form>
        </div>
    </main>

</body>
</html>
